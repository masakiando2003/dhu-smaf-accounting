# ユニットテストと Feature テストを実行する
#
# 手元の Laradock と同じく PHP 7.4・MySQL 8.4 で、テスト専用のデータベース smaf_testing を使う.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しく実行されたら、古い実行は取り消す
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smaf_testing
          MYSQL_USER: default
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: smaf_testing
      DB_USERNAME: default
      DB_PASSWORD: secret
      DB_TIMEZONE: "+09:00"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php7.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php7.4-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit
