# Dependabot のバージョン更新の設定
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # GitHub Actions のアクション（.github/workflows/*.yml の uses:）を最新に保つ
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # 複数のアクションの更新は、1つのプルリクエストにまとめる
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
